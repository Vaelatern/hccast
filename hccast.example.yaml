config:
  router_id: 10.0.255.254
  as: 65000
  listen_port: -1
  graceful_restart: false

  origin: igp
  nexthop: self
  local_pref: 100
  as_path_prepend: []

  communities:
    - "65000:1100"

  health:
    require_token: "healthcheck:ok"
    max_age_seconds: 300

  route_select:
    on_link_only: true
    reject_defaults: true

  reconcile_interval: 30s

  peers:
    - ip: 10.0.1.1
      as: 65000
